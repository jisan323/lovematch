<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b0f2e" />
      <stop offset="50%" stop-color="#1f071a" />
      <stop offset="100%" stop-color="#0d030c" />
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#heartGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Celestial Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Stars -->
  <circle cx="160" cy="120" r="3" fill="#fde047" opacity="0.8" />
  <circle cx="360" cy="130" r="2.5" fill="#fde047" opacity="0.8" />
  <circle cx="120" cy="360" r="2.5" fill="#fde047" opacity="0.7" />
  <circle cx="390" cy="350" r="3" fill="#fde047" opacity="0.7" />
  <path d="M256 70 L259 82 L271 85 L259 88 L256 100 L253 88 L241 85 L253 82 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Heart Glow -->
  <path d="M256 410 C140 320 80 250 80 180 C80 120 125 76 185 76 C225 76 248 100 256 112 C264 100 287 76 327 76 C387 76 432 120 432 180 C432 250 372 320 256 410 Z" 
        fill="url(#heartGrad)" filter="url(#glow)" opacity="0.35" transform="scale(0.85) translate(45, 45)" />

  <!-- Primary Heart -->
  <path d="M256 400 C150 315 95 250 95 186 C95 130 138 90 193 90 C228 90 248 110 256 122 C264 110 284 90 319 90 C374 90 417 130 417 186 C417 250 362 315 256 400 Z" 
        fill="url(#heartGrad)" />

  <!-- Heart Sheen / Highlight -->
  <path d="M140 160 C140 130 160 110 190 105 C175 115 165 135 165 155 C165 175 172 190 160 195 C148 190 140 175 140 160 Z" 
        fill="#ffffff" opacity="0.4" />

  <!-- Center Golden Sparkle -->
  <path d="M256 220 L260 236 L276 240 L260 244 L256 260 L252 244 L236 240 L252 236 Z" fill="url(#goldGrad)" filter="url(#glow)" />
</svg>
